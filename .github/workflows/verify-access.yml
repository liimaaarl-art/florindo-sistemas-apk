name: Verify prototype access protection
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Florindo Sistemas APK]
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar proteção do servidor
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='https://br-late-night-b59w9eej-florindoai.compute.c-7.us-east-2.aws.neon.tech';
          const options={method:'POST',headers:{'Content-Type':'application/json',Origin:'https://localhost'},body:'{}',signal:AbortSignal.timeout(30000)};
          // The APK build verifies provisioning and session validity before generating the artifact.
          for(const path of ['/rpc/florindo_get_state','/rpc/florindo_sync_state']){
            assert.equal((await fetch(base+path,options)).status,401,'Neon data require a valid app session');
          }
          assert.equal((await fetch(base+'/prototype-access',options)).status,403,'Provisioning requires private deployment key');
          console.log('Anonymous data requests and unauthorized prototype provisioning blocked.');
          JS
