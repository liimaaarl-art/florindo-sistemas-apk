name: Build Florindo Sistemas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: florindo-apk-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Restaurar aplicativo
        run: |
          cat .source/index.html.gz.b64.part.* | base64 -d | gzip -d > index.html
          test -s index.html

      - name: Aplicar cadastro, login e ajuste da barra superior
        run: |
          python3 .github/scripts/patch-login.py index.html
          python3 .github/scripts/patch-final-login.py index.html
          grep -q 'id="loginForm"' index.html
          grep -q 'id="loginModeRegister"' index.html
          grep -q 'id="loginModeLogin"' index.html
          grep -q 'id="loginShowPassword"' index.html
          grep -q 'id="loginRemember"' index.html
          grep -q 'FINAL_LOGIN_VERSION' index.html
          grep -q 'florindo_register' index.html
          grep -q 'florindo_login' index.html

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar assistente Gemini e autenticação
        run: |
          node --test backend/engine.test.mjs backend/recovery.test.mjs backend/prototype.test.mjs backend/rpc.test.mjs
          python3 .github/scripts/patch-recovery.py index.html
          python3 .github/scripts/patch-gemini.py index.html

      - name: Preparar credencial temporária de verificação
        run: |
          node --input-type=module <<'JS'
          import {randomBytes} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          const key=randomBytes(32).toString('hex');
          console.log('::add-mask::'+key);
          appendFileSync(process.env.GITHUB_ENV,'PROTOTYPE_SETUP_KEY='+key+'\n');
          JS

      - name: Publicar servidor Neon + Gemini
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::Versão final exige NEON_API_KEY e GEMINI_API_KEY configuradas."
            exit 1
          fi
          npm install --prefix backend --no-audit --no-fund
          npx --prefix backend esbuild backend/index.mjs --bundle --platform=node --target=node24 --format=esm --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" --outfile=backend/dist/index.mjs
          cd backend/dist
          zip -q ../function.zip index.mjs
          cd ../..
          node .github/scripts/deploy-gemini.mjs

      - name: Validar Neon e Gemini de ponta a ponta
        run: |
          node --input-type=module <<'JS'
          import {randomUUID} from 'node:crypto';
          const base=(process.env.FLORINDO_AI_URL||'').replace(/\/$/,'');
          const token=process.env.FLORINDO_PROTOTYPE_TOKEN||'';
          if(!base.startsWith('https://'))throw Error('Endpoint do assistente não foi publicado em HTTPS.');
          if(!/^[a-f0-9]{64}$/.test(token))throw Error('Sessão temporária de verificação inválida.');

          const probe=await fetch(base+'/rpc/florindo_get_state',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({p_token:token}),
            signal:AbortSignal.timeout(30000)
          });
          if(!probe.ok)throw Error('Falha na comunicação do aplicativo com o Neon. HTTP '+probe.status);
          const state=await probe.json();
          for(const key of ['clients','projects','updates','contracts','finances']){
            if(!Array.isArray(state[key]))throw Error('Resposta inválida do Neon em '+key+'.');
          }

          const requestId='finalcheck-'+randomUUID().replaceAll('-','');
          const ai=await fetch(base+'/',{
            method:'POST',
            headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
            body:JSON.stringify({
              requestId,
              command:'Não altere nenhum cadastro. Apenas confirme em uma frase curta que a integração está funcionando.'
            }),
            signal:AbortSignal.timeout(90000)
          });
          const raw=await ai.text();
          if(!ai.ok)throw Error('Falha na comunicação Neon + Gemini. HTTP '+ai.status+' '+raw.slice(0,300));
          const result=JSON.parse(raw);
          if(result.applied!==false)throw Error('A verificação do Gemini não deveria alterar cadastros.');
          if(typeof result.message!=='string'||!result.message.trim())throw Error('Gemini não retornou confirmação válida.');
          console.log('Neon e Gemini verificados com sucesso.');
          JS

      - name: Configurar endereço do assistente no APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          url = os.environ.get('FLORINDO_AI_URL', '')
          if not url.startswith('https://'):
              raise SystemExit('Endpoint final do assistente não foi configurado em HTTPS.')
          text, count = re.subn(
              r'globalThis.FLORINDO_AI_URL=.*?;</script>',
              'globalThis.FLORINDO_AI_URL=' + json.dumps(url) + ';</script>',
              text,
              count=1
          )
          if count != 1:
              raise SystemExit('Configuração do assistente não encontrada no HTML.')
          if 'FLORINDO_PROTOTYPE_TOKEN' in text:
              raise SystemExit('Token de protótipo não pode ser incluído no APK final.')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar dependências Android
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/android@8
          npm install --save-dev @capacitor/cli@8 @capacitor/assets

      - name: Preparar logo Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<img class="brand-logo" src="data:image/(?:jpeg|jpg|png);base64,([^\"]+)', html)
          if not m:
              raise SystemExit('Logo embutida não encontrada no HTML')
          raw = base64.b64decode(m.group(1))
          Path('icon.jpg').write_bytes(raw)
          try:
              from PIL import Image
              im = Image.open('icon.jpg').convert('RGB')
              im.save('icon.png')
          except Exception:
              pass
          PY
          if [ ! -f icon.png ]; then
            python3 -m pip install pillow
            python3 - <<'PY'
          from PIL import Image
          Image.open('icon.jpg').convert('RGB').save('icon.png')
          PY
          fi

      - name: Preparar arquivos web
        run: |
          mkdir -p www
          test -f index.html || (echo "ERRO: index.html não encontrado" && exit 1)
          cp index.html www/index.html
          if [ -f icon.png ]; then cp icon.png www/icon.png; fi

      - name: Criar configuração Capacitor final
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.florindosistemas.central",
            "appName": "Florindo Sistemas",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Configurar rede Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          additions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
          ]
          missing = [x for x in additions if x not in text]
          if missing:
              m = re.search(r'<manifest[^>]*>', text)
              if not m:
                  raise SystemExit("Tag <manifest> não encontrada")
              block = "\n    " + "\n    ".join(missing)
              text = text[:m.end()] + block + text[m.end():]
              path.write_text(text, encoding="utf-8")
          PY

      - name: Gerar ícones e splash
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            cp icon.png assets/splash.png
            npx capacitor-assets generate --android
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Conferir versão final
        run: |
          grep -n "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml
          grep -n "florindo_register" www/index.html
          grep -n "florindo_login" www/index.html
          grep -n "loginModeRegister" www/index.html
          grep -n "loginModeLogin" www/index.html
          grep -n "loginShowPassword" www/index.html
          grep -n "loginRemember" www/index.html
          grep -n "FINAL_LOGIN_VERSION" www/index.html
          grep -n "safe-area-inset-top" www/index.html
          grep -n "FLORINDO_AI_URL" www/index.html
          ! grep -q "FLORINDO_PROTOTYPE_TOKEN" www/index.html
          grep -q '"appId": "com.florindosistemas.central"' capacitor.config.json
          grep -q '"appName": "Florindo Sistemas"' capacitor.config.json

      - name: Gerar APK final
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK final
        uses: actions/upload-artifact@v4
        with:
          name: Florindo-Sistemas-Final-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
