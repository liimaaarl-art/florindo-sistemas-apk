name: Build Florindo Sistemas APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Restaurar aplicativo
        run: |
          cat .source/index.html.gz.b64.part.* | base64 -d | gzip -d > index.html
          test -s index.html

      - name: Aplicar login e ajuste da barra superior
        run: |
          python3 .github/scripts/patch-login.py index.html
          grep -q 'id="loginForm"' index.html
          grep -q 'florindo_login' index.html

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar assistente Gemini
        run: |
          node --test backend/engine.test.mjs backend/recovery.test.mjs backend/prototype.test.mjs backend/rpc.test.mjs
          python3 .github/scripts/patch-recovery.py index.html
          python3 .github/scripts/patch-gemini.py index.html
          python3 .github/scripts/patch-prototype.py index.html

      - name: Preparar acesso privado do protótipo
        run: |
          node --input-type=module <<'JS'
          import {randomBytes} from 'node:crypto';
          import {appendFileSync} from 'node:fs';
          const key=randomBytes(32).toString('hex');
          console.log('::add-mask::'+key);
          appendFileSync(process.env.GITHUB_ENV,'PROTOTYPE_SETUP_KEY='+key+'\n');
          JS

      - name: Publicar servidor Gemini
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "Gemini ainda não publicado: configure NEON_API_KEY e GEMINI_API_KEY nos secrets."
            exit 0
          fi
          npm install --prefix backend --no-audit --no-fund
          npx --prefix backend esbuild backend/index.mjs --bundle --platform=node --target=node24 --format=esm --banner:js="import{createRequire as ___cr}from'module';import{fileURLToPath as ___f}from'url';import{dirname as ___d}from'path';const require=___cr(import.meta.url);const __filename=___f(import.meta.url);const __dirname=___d(__filename);" --outfile=backend/dist/index.mjs
          cd backend/dist
          zip -q ../function.zip index.mjs
          cd ../..
          node .github/scripts/deploy-gemini.mjs

      - name: Preparar sessão do APK de testes
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          const base=process.env.FLORINDO_AI_URL;
          if(!base)throw Error('O acesso ao Neon exige publicar o servidor antes do APK.');
          const response=await fetch(base.replace(/\/$/,'')+'/prototype-access',{method:'POST',headers:{Authorization:'Bearer '+process.env.PROTOTYPE_SETUP_KEY},signal:AbortSignal.timeout(30000)});
          if(!response.ok)throw Error('Não foi possível preparar o acesso do protótipo. HTTP '+response.status);
          const data=await response.json();
          if(!/^[a-f0-9]{64}$/.test(data.token||''))throw Error('Sessão inválida.');
          console.log('::add-mask::'+data.token);
          const probe=await fetch(base.replace(/\/$/,'')+'/rpc/florindo_get_state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({p_token:data.token}),signal:AbortSignal.timeout(30000)});
          if(!probe.ok)throw Error('A sessão do protótipo não conseguiu conectar ao Neon.');
          const state=await probe.json();
          if(!Array.isArray(state.clients)||!Array.isArray(state.projects))throw Error('Resposta inválida na conexão com o Neon.');
          appendFileSync(process.env.GITHUB_ENV,'FLORINDO_PROTOTYPE_TOKEN='+data.token+'\n');
          JS

      - name: Configurar endereço do assistente no APK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          url = os.environ.get('FLORINDO_AI_URL', '')
          text = re.sub(r'globalThis.FLORINDO_AI_URL=.*?;</script>', 'globalThis.FLORINDO_AI_URL=' + json.dumps(url) + ';</script>', text, count=1)
          text = re.sub(r"globalThis.FLORINDO_PROTOTYPE_TOKEN=.*?;</script>", 'globalThis.FLORINDO_PROTOTYPE_TOKEN=' + json.dumps(os.environ.get('FLORINDO_PROTOTYPE_TOKEN', '')) + ';</script>', text, count=1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android API
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar dependencias
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/android@8
          npm install --save-dev @capacitor/cli@8 @capacitor/assets

      - name: Preparar logo Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'<img class="brand-logo" src="data:image/(?:jpeg|jpg|png);base64,([^\"]+)', html)
          if not m:
              raise SystemExit('Logo embutida não encontrada no HTML')
          raw = base64.b64decode(m.group(1))
          Path('icon.jpg').write_bytes(raw)
          try:
              from PIL import Image
              im = Image.open('icon.jpg').convert('RGB')
              im.save('icon.png')
          except Exception:
              pass
          PY
          if [ ! -f icon.png ]; then
            python3 -m pip install pillow
            python3 - <<'PY'
          from PIL import Image
          Image.open('icon.jpg').convert('RGB').save('icon.png')
          PY
          fi

      - name: Preparar arquivos web
        run: |
          mkdir -p www
          test -f index.html || (echo "ERRO: index.html nao encontrado" && exit 1)
          cp index.html www/index.html
          if [ -f icon.png ]; then cp icon.png www/icon.png; fi

      - name: Criar configuracao Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.florindosistemas.central",
            "appName": "Florindo Sistemas",
            "webDir": "www",
            "android": {
              "allowMixedContent": false
            }
          }
          EOF

      - name: Criar projeto Android
        run: |
          rm -rf android
          npx cap add android

      - name: Configurar rede Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")
          additions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />'
          ]
          missing = [x for x in additions if x not in text]
          if missing:
              m = re.search(r'<manifest[^>]*>', text)
              if not m:
                  raise SystemExit("Tag <manifest> nao encontrada")
              block = "\n    " + "\n    ".join(missing)
              text = text[:m.end()] + block + text[m.end():]
              path.write_text(text, encoding="utf-8")
          PY

      - name: Gerar icones e splash
        run: |
          if [ -f icon.png ]; then
            mkdir -p assets
            cp icon.png assets/icon.png
            cp icon.png assets/splash.png
            npx capacitor-assets generate --android
          fi

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Conferir configuracao
        run: |
          grep -n "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml
          grep -n "florindo_login" www/index.html
          grep -n "safe-area-inset-top" www/index.html

      - name: Gerar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Florindo-Sistemas-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
