name: Nexo Build Test

on:
  push:
    branches:
      - grok-nexo-apk
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show environment-independent config
        run: |
          node --version
          npm --version
          cat vercel.json || true

      - name: Compile app (without DB migration)
        env:
          VITE_AUTH_ENABLED: "true"
        run: node scripts/with-app-env.mjs npx vite build
