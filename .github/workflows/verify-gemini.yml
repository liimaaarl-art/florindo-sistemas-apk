name: Verify Gemini API
on:
  push:
    paths:
      - '.github/workflows/verify-gemini.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar chave e modelo Gemini sem dados de clientes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          const key=process.env.GEMINI_API_KEY;
          if(!key)throw Error('Secret GEMINI_API_KEY não configurado.');
          const headers={'x-goog-api-key':key,'Content-Type':'application/json'};
          const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models',{headers,signal:AbortSignal.timeout(20000)});
          if(!r.ok)throw Error('Falha ao listar modelos Gemini: HTTP '+r.status);
          const models=(await r.json()).models||[];
          const names=['models/gemini-3.5-flash-lite','models/gemini-3.1-flash-lite','models/gemini-3.8-flash','models/gemini-2.5-flash-lite','models/gemini-2.5-flash'];
          const chosen=names.find(n=>models.some(m=>m.name===n&&m.supportedGenerationMethods?.includes('generateContent')));
          if(!chosen)throw Error('Nenhum modelo compatível disponível.');
          const response=await fetch('https://generativelanguage.googleapis.com/v1beta/'+chosen+':generateContent',{method:'POST',headers,body:JSON.stringify({contents:[{parts:[{text:'Return only JSON: {"ok":true}'}]}],generationConfig:{responseMimeType:'application/json',maxOutputTokens:1024}}),signal:AbortSignal.timeout(60000)});
          if(!response.ok)throw Error('Falha ao gerar resposta Gemini: HTTP '+response.status+(response.status===429?' (cota indisponível ou atingida)':''));
          const result=await response.json(),text=result.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('');
          if(JSON.parse(text||'{}').ok!==true)throw Error('Gemini não retornou JSON válido no teste.');
          console.log('Chave e geração JSON verificadas. Modelo: '+chosen);
          JS
