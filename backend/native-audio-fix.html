
<script>
let florindoNativeAudioRecording=false,florindoNativeVoiceProxy=null;
const florindoWebAudioToggle=florindoAudioToggle;
function florindoNativeVoice(){if(florindoNativeVoiceProxy)return florindoNativeVoiceProxy;const cap=globalThis.Capacitor;if(!cap?.isNativePlatform?.()||!cap?.registerPlugin)return null;try{florindoNativeVoiceProxy=cap.registerPlugin('FlorindoVoiceRecorder');return florindoNativeVoiceProxy}catch{return null}}
function florindoBase64AudioBlob(base64,mime='audio/mp4'){const raw=atob(String(base64||''));const bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new Blob([bytes],{type:mime})}
florindoAudioToggle=async function(){
 const native=florindoNativeVoice();
 if(!native)return florindoWebAudioToggle();
 const status=$('florindoAudioStatus'),button=$('florindoAudioRecord');
 try{
  if(florindoNativeAudioRecording){
   if(florindoAudioTimer){clearTimeout(florindoAudioTimer);florindoAudioTimer=null}
   if(status)status.textContent='Processando gravação…';
   const result=await native.stop();
   florindoNativeAudioRecording=false;
   if(button)button.textContent='🎙️ Gravar áudio';
   if(!result?.base64)throw Error('A gravação terminou sem áudio. Tente novamente.');
   florindoAudioBlob=florindoBase64AudioBlob(result.base64,result.mimeType||'audio/mp4');
   const send=$('florindoAudioSend');if(send)send.style.display='inline-flex';
   if(status)status.textContent='Áudio pronto. Toque em “Enviar áudio” para transcrever e executar.';
   return;
  }
  florindoAudioBlob=null;
  const send=$('florindoAudioSend');if(send)send.style.display='none';
  await native.start();
  florindoNativeAudioRecording=true;
  if(button)button.textContent='⏹ Parar gravação';
  if(status)status.textContent='Gravando… fale seu comando. Limite de 2 minutos.';
  florindoAudioTimer=setTimeout(()=>{if(florindoNativeAudioRecording)florindoAudioToggle()},120000);
 }catch(e){
  if(florindoAudioTimer){clearTimeout(florindoAudioTimer);florindoAudioTimer=null}
  florindoNativeAudioRecording=false;
  if(button)button.textContent='🎙️ Gravar áudio';
  const message=String(e?.message||e||'');
  if(status)status.textContent=/permission|permiss|microphone|microfone/i.test(message)?'O Android não liberou o microfone para o aplicativo. Abra as permissões do Florindo Sistemas, permita Microfone e tente novamente.':'Não foi possível iniciar a gravação. Tente novamente.';
 }
};
</script>
