<script>
neonRPC=async function(functionName,args){
 const base=globalThis.FLORINDO_AI_URL;
 if(!base)throw Error('Servidor do aplicativo ainda não configurado.');
 const response=await fetch(base.replace(/\/$/,'')+'/rpc/'+encodeURIComponent(functionName),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(args),signal:AbortSignal.timeout(30000)});
 const result=await response.json().catch(()=>({}));
 if(!response.ok){const error=Error(result.error||'Não foi possível acessar o Neon.');error.status=response.status;throw error}
 return result;
};
</script>
