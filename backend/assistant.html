
<script>
let florindoAiBusy=false,florindoAiMessage='',florindoAiPending=null,florindoAudioRecorder=null,florindoAudioStream=null,florindoAudioChunks=[],florindoAudioBlob=null,florindoAudioTimer=null;
let florindoAgendaItems=[];
const florindoAiCommit=commit;
commit=function(mutator){if(florindoAiBusy)return Promise.reject(Error('Aguarde o assistente terminar antes de editar os cadastros.'));return florindoAiCommit(mutator)};
const florindoSafe=value=>typeof esc==='function'?esc(String(value??'')):String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const florindoEndpoint=()=>String(globalThis.FLORINDO_AI_URL||'').replace(/\/$/,'');
async function florindoAuthorizedFetch(path,options={}){const token=neonToken();if(!token)throw Error('Sua sessão expirou. Entre novamente.');const headers={...(options.headers||{}),Authorization:'Bearer '+token};const response=await fetch(florindoEndpoint()+path,{...options,headers,signal:options.signal||AbortSignal.timeout(100000)});let result={};try{result=await response.json()}catch{}if(response.status===401){setNeonToken('',false);showLogin('Sua sessão do Neon expirou. Entre novamente para continuar.','login')}if(!response.ok)throw Error(result.error||result.message||'Não foi possível concluir.');return result}
assistantPage=function(){return header('Assistente IA','Digite ou grave um comando. A IA pode organizar cadastros, financeiro e sua agenda no Neon.')+'<section class="panel"><h2>O que vamos organizar?</h2><p class="subtext" style="margin:16px 0">Exemplos: “Agende reunião com a Paula amanhã às 14h por 45 minutos.” ou “Registre uma cobrança de R$ 150 para o cliente X com vencimento em 10 de novembro.”</p><form id="florindoAiForm"><div class="field"><label for="florindoAiCommand">Seu comando</label><textarea id="florindoAiCommand" name="command" required maxlength="6000" placeholder="Informe o que deseja cadastrar, alterar ou agendar." '+(florindoAiBusy?'disabled':'')+'></textarea></div><div class="florindo-ai-actions"><button class="button primary" type="submit" '+(florindoAiBusy?'disabled':'')+'>'+ (florindoAiBusy?'Organizando…':'Enviar comando')+'</button><button class="button" id="florindoAudioRecord" type="button" '+(florindoAiBusy?'disabled':'')+'>🎙️ Gravar áudio</button><button class="button" id="florindoAudioSend" type="button" style="display:'+(florindoAudioBlob?'inline-flex':'none')+'" '+(florindoAiBusy?'disabled':'')+'>Enviar áudio</button></div></form><p id="florindoAudioStatus" class="helper" style="margin-top:12px">Você pode falar naturalmente. Após enviar o áudio, ele será transcrito e o comando será executado.</p><p id="florindoAiResult" role="status" aria-live="polite" style="white-space:pre-wrap;margin-top:20px">'+florindoSafe(florindoAiMessage)+'</p><p class="helper">A IA pode criar e atualizar clientes, sistemas, versões, contratos, financeiro e compromissos da agenda. Se faltar data, horário ou outra informação essencial, ela pede detalhes antes de alterar seus dados.</p></section>'};
async function florindoAiExecute(command){
 command=String(command||'').trim();if(!command||florindoAiBusy)return;
 const token=neonToken();if(!token){toast('Sua sessão não está ativa. Entre novamente para conectar Neon e IA.');return}
 if(!neonOnline){try{await connectNeon(token)}catch(e){toast('Não foi possível reativar o Neon. Entre novamente para renovar a sessão.');return}}
 const endpoint=florindoEndpoint();if(!endpoint){toast('O servidor da IA ainda precisa ser publicado.');return}
 await mutationChain.catch(()=>{});florindoAiBusy=true;
 const form=$('florindoAiForm');if(form)for(const b of form.querySelectorAll('button'))b.disabled=true;
 florindoAiMessage='Consultando a IA…';if($('florindoAiResult'))$('florindoAiResult').textContent=florindoAiMessage;
 let applied=false;const requestId=florindoAiPending?.command===command?florindoAiPending.id:uid();florindoAiPending={command,id:requestId};
 try{
  const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+neonToken()},body:JSON.stringify({command,requestId}),signal:AbortSignal.timeout(100000)});
  const result=await response.json();
  if(!response.ok){if(response.status!==409)florindoAiPending=null;if(response.status===401){setNeonToken('',false);showLogin('Sua sessão do Neon expirou. Entre novamente para continuar.','login')}throw Error(result.error||result.message||'Não foi possível concluir.')}
  applied=!!result.applied;florindoAiPending=null;florindoAiMessage=result.message||'Solicitação concluída.';
  if(applied){
   const remote=await neonRPC('florindo_get_state',{p_token:neonToken()});const next=JSON.parse(JSON.stringify(state));for(const key of ['clients','projects','updates','contracts','finances'])next[key]=remote[key]||[];next.contracts=next.contracts.map(c=>({...c,file:state.contracts.find(x=>x.id===c.id)?.file||null}));const valid=D.validateBackup(next);await writeState(valid);state=valid;
   if(result.agendaChanged&&$('florindoAgendaDialog')?.open)await florindoAgendaLoad();
  }
 }catch(e){florindoAiMessage=applied?'As alterações foram salvas no Neon, mas a tela não atualizou. Feche e abra o aplicativo para recarregar.':e.name==='TimeoutError'||e.name==='TypeError'?'Não foi possível confirmar a resposta. Envie o mesmo comando novamente para consultar a solicitação sem duplicá-la.':e.message||'Não foi possível concluir.'}
 finally{florindoAiBusy=false;if(route==='assistant')render();toast(florindoAiMessage)}
}
document.addEventListener('submit',async event=>{if(event.target.id!=='florindoAiForm')return;event.preventDefault();const command=String(new FormData(event.target).get('command')||'').trim();await florindoAiExecute(command)});
function florindoAudioCleanup(){if(florindoAudioTimer){clearTimeout(florindoAudioTimer);florindoAudioTimer=null}if(florindoAudioStream){for(const track of florindoAudioStream.getTracks())track.stop();florindoAudioStream=null}}
async function florindoAudioToggle(){
 const status=$('florindoAudioStatus'),button=$('florindoAudioRecord');
 if(florindoAudioRecorder&&florindoAudioRecorder.state==='recording'){florindoAudioRecorder.stop();if(button)button.textContent='🎙️ Gravar áudio';if(status)status.textContent='Processando gravação…';return}
 if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){if(status)status.textContent='Este aparelho não disponibilizou o gravador. Você ainda pode digitar o comando.';return}
 try{
  florindoAudioBlob=null;florindoAudioChunks=[];florindoAudioStream=await navigator.mediaDevices.getUserMedia({audio:true});
  const types=['audio/webm;codecs=opus','audio/webm','audio/mp4'];const mime=types.find(x=>MediaRecorder.isTypeSupported?.(x))||'';florindoAudioRecorder=new MediaRecorder(florindoAudioStream,mime?{mimeType:mime}:undefined);
  florindoAudioRecorder.ondataavailable=e=>{if(e.data?.size)florindoAudioChunks.push(e.data)};
  florindoAudioRecorder.onstop=()=>{florindoAudioBlob=new Blob(florindoAudioChunks,{type:florindoAudioRecorder.mimeType||'audio/webm'});florindoAudioCleanup();const send=$('florindoAudioSend');if(send)send.style.display='inline-flex';if(status)status.textContent='Áudio pronto. Toque em “Enviar áudio” para transcrever e executar.'};
  florindoAudioRecorder.start(500);if(button)button.textContent='⏹ Parar gravação';if(status)status.textContent='Gravando… fale seu comando. Limite de 2 minutos.';florindoAudioTimer=setTimeout(()=>{if(florindoAudioRecorder?.state==='recording')florindoAudioRecorder.stop()},120000);
 }catch(e){florindoAudioCleanup();if(status)status.textContent='Não foi possível acessar o microfone. Autorize o uso do microfone e tente novamente.'}
}
async function florindoAudioSend(){
 if(!florindoAudioBlob||florindoAiBusy)return;const status=$('florindoAudioStatus'),send=$('florindoAudioSend');if(send)send.disabled=true;if(status)status.textContent='Transcrevendo áudio com IA…';
 try{const data=new FormData();const ext=florindoAudioBlob.type.includes('mp4')?'m4a':'webm';data.append('audio',florindoAudioBlob,'comando.'+ext);const result=await florindoAuthorizedFetch('/transcribe',{method:'POST',body:data,signal:AbortSignal.timeout(100000)});const text=String(result.text||'').trim();if(!text)throw Error('Não consegui entender o áudio.');const field=$('florindoAiCommand');if(field)field.value=text;if(status)status.textContent='Transcrição: “'+text+'” · Executando comando…';florindoAudioBlob=null;if(send)send.style.display='none';await florindoAiExecute(text)}catch(e){if(status)status.textContent=e.message||'Não foi possível enviar o áudio.';toast(e.message||'Falha no áudio.')}finally{if(send)send.disabled=false}
}
document.addEventListener('click',event=>{if(event.target.closest('#florindoAudioRecord')){event.preventDefault();florindoAudioToggle()}if(event.target.closest('#florindoAudioSend')){event.preventDefault();florindoAudioSend()}});

function florindoAgendaCss(){if($('florindoAgendaStyle'))return;const style=document.createElement('style');style.id='florindoAgendaStyle';style.textContent=`
.florindo-agenda-launch{width:calc(100% - 28px);margin:10px 14px 18px;padding:12px 15px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.08);color:inherit;font:inherit;font-weight:800;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px}.florindo-agenda-launch:hover{background:rgba(255,255,255,.14)}
.florindo-agenda-dialog{border:0;padding:0;border-radius:24px;width:min(920px,calc(100vw - 28px));max-width:none;background:#f7f9f8;color:#173847;box-shadow:0 28px 90px rgba(8,35,52,.3)}.florindo-agenda-dialog::backdrop{background:rgba(5,24,34,.62);backdrop-filter:blur(3px)}.florindo-agenda-shell{padding:24px}.florindo-agenda-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.florindo-agenda-head h2{margin:0;font-size:25px}.florindo-agenda-head p{margin:5px 0 0;color:#6d7f87;font-size:12px}.florindo-agenda-close{border:0;background:#e8eef0;width:42px;height:42px;border-radius:50%;font-size:24px;color:#34515e}.florindo-agenda-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.florindo-agenda-list{display:grid;gap:10px;max-height:54vh;overflow:auto;padding-right:3px}.florindo-appt{display:grid;grid-template-columns:100px 1fr auto;gap:14px;align-items:center;padding:14px;background:#fff;border:1px solid #e1e8e9;border-radius:16px}.florindo-appt-time{font-weight:900;color:#0b6481}.florindo-appt-title{font-weight:800}.florindo-appt-meta{font-size:11px;color:#708088;margin-top:4px}.florindo-appt-status{font-size:10px;font-weight:800;padding:6px 9px;border-radius:999px;background:#e8f3ed;color:#24704b}.florindo-appt-status.cancelado{background:#f4e9e8;color:#934c45}.florindo-appt-status.concluído{background:#e9eef6;color:#48658c}.florindo-agenda-empty{padding:30px;text-align:center;background:#fff;border:1px dashed #ccd8dc;border-radius:16px;color:#788991}.florindo-agenda-form{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:18px;padding:18px;background:#fff;border:1px solid #e0e7e9;border-radius:18px}.florindo-agenda-form .wide{grid-column:1/-1}.florindo-agenda-form label{display:block;font-size:10px;font-weight:800;color:#58707a;margin-bottom:6px}.florindo-agenda-form input,.florindo-agenda-form select,.florindo-agenda-form textarea{width:100%;box-sizing:border-box;border:1px solid #d5e0e3;border-radius:11px;padding:11px;background:#fbfcfc;color:#173847}.florindo-agenda-form textarea{min-height:80px;resize:vertical}.florindo-agenda-actions{grid-column:1/-1;display:flex;gap:9px;flex-wrap:wrap}.florindo-ai-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:620px){.florindo-agenda-dialog{width:100vw;height:100dvh;max-height:none;border-radius:0;margin:0}.florindo-agenda-shell{padding:calc(env(safe-area-inset-top) + 17px) 14px calc(env(safe-area-inset-bottom) + 18px)}.florindo-agenda-list{max-height:42vh}.florindo-appt{grid-template-columns:76px 1fr;gap:9px}.florindo-appt-status{grid-column:2;justify-self:start}.florindo-agenda-form{grid-template-columns:1fr}.florindo-agenda-form .wide,.florindo-agenda-actions{grid-column:1}}
`;document.head.appendChild(style)}
function florindoAgendaInstall(){
 florindoAgendaCss();if(!$('florindoAgendaDialog')){const dialog=document.createElement('dialog');dialog.id='florindoAgendaDialog';dialog.className='florindo-agenda-dialog';dialog.innerHTML='<div class="florindo-agenda-shell"><div class="florindo-agenda-head"><div><h2>Agenda</h2><p>Compromissos salvos no Neon e disponíveis para a Assistente IA.</p></div><button class="florindo-agenda-close" type="button" aria-label="Fechar">×</button></div><div class="florindo-agenda-toolbar"><button class="button primary" id="florindoAgendaNew" type="button">+ Novo compromisso</button><button class="button" id="florindoAgendaRefresh" type="button">↻ Atualizar</button></div><div id="florindoAgendaList" class="florindo-agenda-list"></div><div id="florindoAgendaEditor"></div></div>';document.body.appendChild(dialog)}
 const side=document.querySelector('.sidebar');if(side&&!side.querySelector('.florindo-agenda-launch')){const button=document.createElement('button');button.type='button';button.className='florindo-agenda-launch';button.innerHTML='<span>📅</span><span>Agenda</span>';button.addEventListener('click',florindoAgendaOpen);side.appendChild(button)}
}
async function florindoAgendaOpen(){florindoAgendaInstall();const dialog=$('florindoAgendaDialog');if(!dialog.open)dialog.showModal();await florindoAgendaLoad()}
async function florindoAgendaLoad(){const list=$('florindoAgendaList');if(!list)return;if(!florindoEndpoint()){list.innerHTML='<div class="florindo-agenda-empty">Servidor ainda não configurado.</div>';return}list.innerHTML='<div class="florindo-agenda-empty">Carregando agenda…</div>';try{const result=await florindoAuthorizedFetch('/agenda/list',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});florindoAgendaItems=Array.isArray(result.appointments)?result.appointments:[];florindoAgendaRender()}catch(e){list.innerHTML='<div class="florindo-agenda-empty">'+florindoSafe(e.message)+'</div>'}}
function florindoAgendaRender(){const list=$('florindoAgendaList');if(!list)return;const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());const ordered=[...florindoAgendaItems].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));const visible=ordered.filter(x=>x.status!=='Cancelado'||x.date>=today);if(!visible.length){list.innerHTML='<div class="florindo-agenda-empty">Nenhum compromisso cadastrado. Use “Novo compromisso” ou peça para a IA agendar por você.</div>';return}list.innerHTML=visible.map(x=>{const client=state.clients.find(c=>c.id===x.clientId);const meta=[x.date.split('-').reverse().join('/'),client?.name||'',x.location||'',x.duration?x.duration+' min':''].filter(Boolean).join(' · ');return '<div class="florindo-appt" data-agenda-id="'+florindoSafe(x.id)+'"><div class="florindo-appt-time">'+florindoSafe(x.time)+'</div><div><div class="florindo-appt-title">'+florindoSafe(x.title)+'</div><div class="florindo-appt-meta">'+florindoSafe(meta)+'</div></div><span class="florindo-appt-status '+florindoSafe(String(x.status).toLowerCase())+'">'+florindoSafe(x.status)+'</span></div>'}).join('')}
function florindoAgendaEdit(id=''){const item=florindoAgendaItems.find(x=>x.id===id)||{};const clients=[...state.clients].sort((a,b)=>a.name.localeCompare(b.name));const today=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());$('florindoAgendaEditor').innerHTML='<form id="florindoAgendaForm" class="florindo-agenda-form"><input type="hidden" name="id" value="'+florindoSafe(item.id||'')+'"><div class="wide"><label>Título</label><input name="title" maxlength="200" required value="'+florindoSafe(item.title||'')+'" placeholder="Ex.: Reunião com cliente"></div><div><label>Data</label><input name="date" type="date" required value="'+florindoSafe(item.date||today)+'"></div><div><label>Horário</label><input name="time" type="time" required value="'+florindoSafe(item.time||'09:00')+'"></div><div><label>Duração (minutos)</label><input name="duration" type="number" min="5" max="1440" step="5" value="'+florindoSafe(item.duration||60)+'"></div><div><label>Status</label><select name="status">'+['Agendado','Concluído','Cancelado'].map(s=>'<option '+(item.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="wide"><label>Cliente (opcional)</label><select name="clientId"><option value="">Sem cliente vinculado</option>'+clients.map(c=>'<option value="'+florindoSafe(c.id)+'" '+(item.clientId===c.id?'selected':'')+'>'+florindoSafe(c.name)+'</option>').join('')+'</select></div><div class="wide"><label>Local</label><input name="location" maxlength="500" value="'+florindoSafe(item.location||'')+'" placeholder="Presencial, endereço ou link"></div><div class="wide"><label>Observações</label><textarea name="notes" maxlength="5000">'+florindoSafe(item.notes||'')+'</textarea></div><div class="florindo-agenda-actions"><button class="button primary" type="submit">Salvar compromisso</button><button class="button" id="florindoAgendaCancelEdit" type="button">Cancelar</button>'+(item.id?'<button class="button danger" id="florindoAgendaDelete" type="button" data-id="'+florindoSafe(item.id)+'">Excluir</button>':'')+'</div></form>';setTimeout(()=>$('florindoAgendaForm')?.querySelector('[name="title"]')?.focus(),50)}
async function florindoAgendaSave(form){const data=new FormData(form),body={id:String(data.get('id')||''),title:String(data.get('title')||'').trim(),date:String(data.get('date')||''),time:String(data.get('time')||''),duration:Number(data.get('duration')||60),status:String(data.get('status')||'Agendado'),clientId:String(data.get('clientId')||''),location:String(data.get('location')||'').trim(),notes:String(data.get('notes')||'').trim()};const button=form.querySelector('[type="submit"]');button.disabled=true;try{const result=await florindoAuthorizedFetch('/agenda/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});toast(result.message||'Compromisso salvo.');$('florindoAgendaEditor').innerHTML='';await florindoAgendaLoad()}catch(e){toast(e.message||'Não foi possível salvar o compromisso.')}finally{button.disabled=false}}
async function florindoAgendaDelete(id){if(!confirm('Excluir este compromisso da agenda?'))return;try{const result=await florindoAuthorizedFetch('/agenda/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});toast(result.message||'Compromisso excluído.');$('florindoAgendaEditor').innerHTML='';await florindoAgendaLoad()}catch(e){toast(e.message||'Não foi possível excluir.')}}
document.addEventListener('submit',event=>{if(event.target.id==='florindoAgendaForm'){event.preventDefault();florindoAgendaSave(event.target)}});
document.addEventListener('click',event=>{if(event.target.closest('.florindo-agenda-close'))$('florindoAgendaDialog')?.close();if(event.target.closest('#florindoAgendaNew'))florindoAgendaEdit();if(event.target.closest('#florindoAgendaRefresh'))florindoAgendaLoad();if(event.target.closest('#florindoAgendaCancelEdit'))$('florindoAgendaEditor').innerHTML='';const card=event.target.closest('[data-agenda-id]');if(card&&!event.target.closest('button'))florindoAgendaEdit(card.dataset.agendaId);const del=event.target.closest('#florindoAgendaDelete');if(del)florindoAgendaDelete(del.dataset.id)});
florindoAgendaInstall();
</script>
